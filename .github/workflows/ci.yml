name: CI

on:
  push:
    branches: [main]
  pull_request:

# Keep in step with the version in README.md and pubspec.yaml.
env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build secrets are git-ignored; fail if one was force-added anyway.
      - name: No secret files in the repository
        run: |
          found=$(git ls-files |
            grep -E '(^|/)\.env($|\.)|(^|/)secrets\.properties$|(^|/)key\.properties$|(^|/)Secrets\.xcconfig$|\.(jks|keystore|p12|mobileprovision)$' |
            grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$found" ]; then
            echo "Secret files are tracked; remove them with git rm --cached:"
            echo "$found"
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-android:
    name: Build Android (debug)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # No secrets needed: the app builds with empty configuration and a
      # placeholder Maps key. It only proves that the project compiles.
      - run: flutter build apk --debug --dart-define-from-file=.env.example
